{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3">Register Account</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3"><label>Username</label>{{ form.username }}</div>
                <div class="mb-3"><label>Password</label>{{ form.password }}</div>
                <div class="mb-3"><label>Confirm Password</label>{{ form.password_confirm }}</div>
                <div class="mb-3"><label>Email</label>{{ form.email }}</div>
                <button type="submit" class="btn btn-success w-100">Sign Up</button>
            </form>
            <p class="mt-3 text-center"><small>Already registered? <a href="{% url 'login' %}">Login here</a></small></p>
        </div>
    </div>
</div>
{% endblock %}
