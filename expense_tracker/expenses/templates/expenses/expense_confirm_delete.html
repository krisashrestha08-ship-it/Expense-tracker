{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 text-center">
            <h3>Delete Expense?</h3>
            <p class="text-muted">Are you sure you want to delete "<strong>{{ expense.title }}</strong>" (${{ expense.amount }})?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Confirm Delete</button>
                <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
