{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">{{ title }}</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">Title</label>{{ form.title }}</div>
                <div class="mb-3"><label class="form-label">Amount ($)</label>{{ form.amount }}</div>
                <div class="mb-3"><label class="form-label">Category</label>{{ form.category }}</div>
                <div class="mb-3"><label class="form-label">Date</label>{{ form.date }}</div>
                <div class="mb-3"><label class="form-label">Notes</label>{{ form.notes }}</div>
                <button type="submit" class="btn btn-success w-100">Save Transaction</button>
                <a href="{% url 'expense_list' %}" class="btn btn-link w-100 mt-2 text-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
